    <!-- Intro Animation & PWA Install Logic -->
    <script>
      // Intro Animation Logic
      (function() {
        const intro = document.getElementById('rohan-game-intro');
        const skipBtn = document.getElementById('rohan-intro-skip-btn');
        let completed = false;

        function closeIntro() {
          if (completed) return;
          completed = true;
          if (intro) {
            intro.style.opacity = '0';
            intro.style.transform = 'scale(1.04)';
            setTimeout(() => {
              intro.style.display = 'none';
            }, 700);
          }
        }

        // Play intro audio
        try {
          const introAudio = new Audio('/assets/aistudio/sfx/company_logo.mp3');
          introAudio.volume = 0.8;
          introAudio.play().catch(() => {});
        } catch(e) {}

        if (skipBtn) skipBtn.addEventListener('click', closeIntro);
        if (intro) intro.addEventListener('click', closeIntro);

        // Auto close after 3.8s
        setTimeout(closeIntro, 3800);
      })();

      // PWA Installation & Service Worker Register
      (function() {
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch((err) => {
              console.log('SW registration error:', err);
            });
          });
        }

        let deferredPrompt = null;
        const installBtn = document.getElementById('pwa-install-banner');

        // Check if already in standalone mode
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        if (!isStandalone) {
          window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (installBtn) {
              installBtn.style.display = 'inline-flex';
            }
          });
        }

        if (installBtn) {
          installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) {
              alert('ফোনে হোমস্ক্রিনে অ্যাড করতে ব্রাউজার মেনুর "Add to Home Screen" অপশন ব্যবহার করুন।');
              return;
            }
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
              installBtn.style.display = 'none';
            }
            deferredPrompt = null;
          });
        }

        window.addEventListener('appinstalled', () => {
          if (installBtn) installBtn.style.display = 'none';
        });
      })();
    </script>
